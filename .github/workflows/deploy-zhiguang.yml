name: Deploy Zhiguang

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-zhiguang-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend and frontend
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://v4.gh-proxy.org/https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_CONFIG_KEY_1: http.version
          GIT_CONFIG_VALUE_1: HTTP/1.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Publish runtime configuration to Nacos
        env:
          NACOS_SERVER_ADDR: ${{ vars.NACOS_SERVER_ADDR || '100.83.242.114:8848' }}
          NACOS_USERNAME: ${{ secrets.NACOS_USERNAME }}
          NACOS_PASSWORD: ${{ secrets.NACOS_PASSWORD }}
          NACOS_CONFIG_GROUP: ZHIGUANG_GROUP
        run: bash scripts/deploy/sync-nacos-config.sh zhiguang_be/nacos-config/nacos-import/ZHIGUANG_GROUP/zhiguang-runtime.yaml

      - name: Deploy backend on internal server
        env:
          SUDO_PASSWORD: ${{ secrets.INTERNAL_SUDO_PASSWORD }}
          SMTP: ${{ secrets.SMTP }}
          MINIO_PUBLIC_DOMAIN: ${{ vars.MINIO_PUBLIC_DOMAIN || 'http://47.108.66.230' }}
          GITHUB_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.CLIENT_SECRETS }}
          GITHUB_REDIRECT_URI: ${{ vars.GITHUB_REDIRECT_URI || 'http://47.108.66.230/callback' }}
          GITHUB_EXTERNAL_SEARCH_TOKEN: ${{ secrets.GITHUB_EXTERNAL_SEARCH_TOKEN }}
          NACOS_SERVER_ADDR: ${{ vars.NACOS_SERVER_ADDR || '100.83.242.114:8848' }}
          NACOS_USERNAME: ${{ secrets.NACOS_USERNAME }}
          NACOS_PASSWORD: ${{ secrets.NACOS_PASSWORD }}
          NACOS_CONFIG_GROUP: ZHIGUANG_GROUP
        run: bash scripts/deploy/internal-backend.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zhiguang_fe/zhiguang_fe-main/package-lock.json

      - name: Build frontend
        working-directory: zhiguang_fe/zhiguang_fe-main
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to cloud gateway
        env:
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_SSH_KEY: ${{ secrets.CLOUD_SSH_KEY }}
          CLOUD_WEB_ROOT: /var/www/zhiguang-fe
        run: bash scripts/deploy/cloud-frontend.sh zhiguang_fe/zhiguang_fe-main/dist
