name: Deploy Zhiguang

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-zhiguang-main
  cancel-in-progress: false

jobs:
  inject-benchmark-token:
    name: Inject Benchmark credential
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://v4.gh-proxy.org/https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_CONFIG_KEY_1: http.version
          GIT_CONFIG_VALUE_1: HTTP/1.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Inject and verify Benchmark credential
        env:
          SUDO_PASSWORD: ${{ secrets.INTERNAL_SUDO_PASSWORD }}
          BENCHMARK_TOKEN: ${{ secrets.BENCHMARK_TOKEN }}
        run: bash scripts/deploy/internal-backend.sh inject-benchmark-token

  deploy:
    name: Deploy backend and frontend
    needs: inject-benchmark-token
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://v4.gh-proxy.org/https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_CONFIG_KEY_1: http.version
          GIT_CONFIG_VALUE_1: HTTP/1.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Publish runtime configuration to Nacos
        env:
          NACOS_SERVER_ADDR: ${{ vars.NACOS_SERVER_ADDR || '100.83.242.114:8848' }}
          NACOS_USERNAME: ${{ secrets.NACOS_USERNAME }}
          NACOS_PASSWORD: ${{ secrets.NACOS_PASSWORD }}
          NACOS_CONFIG_GROUP: ZHIGUANG_GROUP
        run: bash scripts/deploy/sync-nacos-config.sh zhiguang_be/nacos-config/nacos-import/ZHIGUANG_GROUP/zhiguang-runtime.yaml

      - name: Deploy backend on internal server
        env:
          SUDO_PASSWORD: ${{ secrets.INTERNAL_SUDO_PASSWORD }}
          SMTP: ${{ secrets.SMTP }}
          MINIO_PUBLIC_DOMAIN: ${{ vars.MINIO_PUBLIC_DOMAIN || 'http://47.108.66.230' }}
          GITHUB_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.CLIENT_SECRETS }}
          GITHUB_REDIRECT_URI: ${{ vars.GITHUB_REDIRECT_URI || 'https://47.108.66.230/callback' }}
          GITHUB_EXTERNAL_SEARCH_TOKEN: ${{ secrets.GITHUB_EXTERNAL_SEARCH_TOKEN }}
          NACOS_SERVER_ADDR: ${{ vars.NACOS_SERVER_ADDR || '100.83.242.114:8848' }}
          NACOS_USERNAME: ${{ secrets.NACOS_USERNAME }}
          NACOS_PASSWORD: ${{ secrets.NACOS_PASSWORD }}
          NACOS_CONFIG_GROUP: ZHIGUANG_GROUP
        run: bash scripts/deploy/internal-backend.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zhiguang_fe/zhiguang_fe-main/package-lock.json

      - name: Build frontend
        working-directory: zhiguang_fe/zhiguang_fe-main
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to cloud gateway
        env:
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_SSH_KEY: ${{ secrets.CLOUD_SSH_KEY }}
          CLOUD_WEB_ROOT: /var/www/zhiguang-fe
        run: bash scripts/deploy/cloud-frontend.sh zhiguang_fe/zhiguang_fe-main/dist

  benchmark:
    name: Run RAG Benchmark
    needs: deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[run-bench]')
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout evaluated revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Benchmark run
        shell: bash
        run: |
          run_id="benchmark-${GITHUB_RUN_ID}-${GITHUB_SHA:0:7}"
          run_dir="${GITHUB_WORKSPACE}/zhiguang_be/target/rag-benchmark/${run_id}"
          echo "BENCHMARK_RUN_ID=${run_id}" >> "$GITHUB_ENV"
          echo "BENCHMARK_RUN_DIR=${run_dir}" >> "$GITHUB_ENV"

      - name: Verify deployed backend health
        shell: bash
        env:
          BENCHMARK_BASE_URL: ${{ vars.BENCHMARK_BASE_URL || 'http://127.0.0.1:18080' }}
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "${BENCHMARK_BASE_URL}/actuator/health" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Benchmark backend health check failed" >&2
          exit 1

      - name: Verify Benchmark authentication
        shell: bash
        env:
          BENCHMARK_BASE_URL: ${{ vars.BENCHMARK_BASE_URL || 'http://127.0.0.1:18080' }}
          BENCHMARK_TOKEN: ${{ secrets.BENCHMARK_TOKEN }}
        run: |
          if [[ -z "$BENCHMARK_TOKEN" ]]; then
            echo "GitHub Secret BENCHMARK_TOKEN is missing" >&2
            exit 1
          fi

          status="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
            -H "X-Benchmark-Token: $BENCHMARK_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "${BENCHMARK_BASE_URL}/api/internal/rag-benchmark/single-case" || true)"

          if [[ "$status" != "400" ]]; then
            echo "Benchmark authentication preflight failed: expected HTTP 400 after authentication, got ${status:-no response}" >&2
            echo "HTTP 401 means the credential was rejected; HTTP 503 means the backend credential is not configured." >&2
            exit 1
          fi

          echo "Benchmark authentication preflight passed"

      - name: Collect 40 Java RAG Transcripts
        id: collect
        continue-on-error: true
        shell: bash
        working-directory: zhiguang_be
        env:
          BENCHMARK_BASE_URL: ${{ vars.BENCHMARK_BASE_URL || 'http://127.0.0.1:18080' }}
          BENCHMARK_TOKEN: ${{ secrets.BENCHMARK_TOKEN }}
        run: |
          python scripts/AUTO_Benchwork/benchmark.py \
            --base-url "$BENCHMARK_BASE_URL" \
            --run-id "$BENCHMARK_RUN_ID" \
            --output-dir "$BENCHMARK_RUN_DIR"

      - name: Build retrieval funnel and diff reports
        id: report
        if: always()
        shell: bash
        working-directory: zhiguang_be
        run: |
          report_args=(--run-dir "$BENCHMARK_RUN_DIR")
          baseline_path="scripts/AUTO_Benchwork/baseline/funnel-report.json"
          if [[ -f "$baseline_path" ]]; then
            report_args+=(--baseline "$baseline_path")
          fi
          python scripts/AUTO_Benchwork/report_generator.py "${report_args[@]}"

      - name: Judge final answers and create review summary
        id: judge
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: zhiguang_be
        env:
          QIANFAN_JUDGE_API_KEY: ${{ secrets.QIANFAN_JUDGE_API_KEY }}
        run: |
          python scripts/AUTO_Benchwork/judge.py \
            --run-dir "$BENCHMARK_RUN_DIR"

      - name: Show Benchmark summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${BENCHMARK_RUN_DIR}/summary.md" ]]; then
            cat "${BENCHMARK_RUN_DIR}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Annotate partial Benchmark results
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - "${BENCHMARK_RUN_DIR}" <<'PY'
          import json
          import sys
          from pathlib import Path

          run_dir = Path(sys.argv[1])
          reports = (
              (run_dir / "1-2-runtime-metadata.json", "collectionStatus", "Transcript collection"),
              (run_dir / "3-1-judge-report.json", "evaluationStatus", "LLM judge"),
          )
          for path, status_field, label in reports:
              if not path.is_file():
                  continue
              document = json.loads(path.read_text(encoding="utf-8"))
              status = document.get(status_field, "UNKNOWN")
              if status == "PARTIAL":
                  print(f"::warning title={label} is partial::{path.name} contains the per-case diagnostics.")
          PY

      - name: Upload Benchmark Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-benchmark-${{ github.run_id }}
          path: ${{ env.BENCHMARK_RUN_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail only on Benchmark execution failures
        if: always()
        shell: bash
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          JUDGE_OUTCOME: ${{ steps.judge.outcome }}
        run: |
          if [[ "$COLLECT_OUTCOME" != "success" || "$REPORT_OUTCOME" != "success" || "$JUDGE_OUTCOME" != "success" ]]; then
            echo "Benchmark execution failed completely in at least one phase; available reports and artifacts were retained." >&2
            exit 1
          fi
