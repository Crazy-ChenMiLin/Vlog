services:
  zhiguang-be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhiguang-be
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-100.83.242.114:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-zhiguang-dev}
      ZHIGUANG_SECRETS_IMPORT: file:/run/secrets/zhiguang-backend.yml
    secrets:
      - source: backend-secrets
        target: zhiguang-backend.yml

  mysql:
    profiles: [middleware]
    image: mysql:8.4
    container_name: zhiguang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiguang_auth}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD:-} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    profiles: [middleware]
    image: redis:7.2
    container_name: zhiguang-redis
    restart: unless-stopped
    #    aof
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SPRING_DATA_REDIS_PASSWORD:-}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    profiles: [middleware]
    image: bitnamilegacy/kafka:4.0.0
    container_name: zhiguang-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_MESSAGE_MAX_BYTES: 10485760
      KAFKA_CFG_FETCH_MESSAGE_MAX_BYTES: 10485760
      KAFKA_CFG_PARTITION_FETCH_BYTES: 10485760
      KAFKA_CFG_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_CFG_MAX_REQUEST_SIZE: 10485760
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - kafka-data:/bitnami/kafka

  elasticsearch:
    profiles: [middleware]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: zhiguang-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${SPRING_ELASTICSEARCH_PASSWORD:-}
      ES_JAVA_OPTS: -Xms512m -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    profiles: [middleware]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: zhiguang-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

secrets:
  backend-secrets:
    file: ${ZHIGUANG_SECRETS_FILE:-${USERPROFILE:-${HOME}}/.zhiguang/backend-secrets.yml}

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  es-data:
  minio-data:
