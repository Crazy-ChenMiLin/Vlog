spring:
  application:
    name: zhiguang-be
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 300000
      connection-timeout: 30000
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      timeout: 10s
      connect-timeout: 10s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 10s
  mail:
    protocol: smtps
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  kafka:
    template:
      default-topic: counter-events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      linger: 10ms
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: counter-agg
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      type: single
      ack-mode: manual
  ai:
    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      elasticsearch:
        initialize-schema: true
        dimensions: 4096
        similarity: cosine

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

auth:
  jwt:
    issuer: zhiguang
    key-id: zhiguang-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  verification:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    send-interval: PT60S
    daily-limit: 10
  password:
    bcrypt-strength: 12
    min-length: 8

oss:
  folder: avatars

cache:
  l2:
    public-cfg:
      ttl-seconds: 15
      max-size: 1000
    mine-cfg:
      ttl-seconds: 10
      max-size: 1000

logging:
  level:
    root: INFO
    '[com.tongji]': DEBUG

rag:
  prompt:
    server-addr: "${NACOS_SERVER_ADDR:100.83.242.114:8848}"
    username: "${NACOS_USERNAME:}"
    password: "${NACOS_PASSWORD:}"
    cache-ttl-seconds: 60

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: "${ZHIGUANG_SECRETS_IMPORT:optional:file:${user.home}/.zhiguang/backend-secrets.yml}"

---
spring:
  config:
    activate:
      on-profile: "!test & !standalone"
    import: "nacos:zhiguang-runtime.yaml?group=${NACOS_CONFIG_GROUP:ZHIGUANG_GROUP}&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: "${NACOS_SERVER_ADDR:100.83.242.114:8848}"
      username: "${NACOS_USERNAME:}"
      password: "${NACOS_PASSWORD:}"
      config:
        namespace: "${NACOS_NAMESPACE:zhiguang-dev}"

---
spring:
  config:
    activate:
      on-profile: "test | standalone"
  cloud:
    nacos:
      config:
        enabled: false

oss:
  endpoint: "${MINIO_ENDPOINT:}"
  access-key-id: "${MINIO_ACCESS_KEY:}"
  access-key-secret: "${MINIO_SECRET_KEY:}"
  public-domain: "${MINIO_PUBLIC_DOMAIN:}"
  bucket: "${MINIO_BUCKET:}"
